<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaSync – Registros de Manutenção</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">OficinaSync</span>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">

        <div class="mb-4">
            <h1 class="h3">Registro de manutenção de equipamentos</h1>
            <p class="text-muted mb-0">
                Agende o envio de um registro e consulte os últimos registros salvos na API.
            </p>
        </div>

        <!-- Alert de sincronização (aparece via JavaScript) -->
        <div id="area-alerta"></div>

        <div class="row g-2 mb-3">
            <div class="col-12 col-md-auto">
                <button id="btn-sincronizar" type="button" class="btn btn-success w-100">
                    Agendar sincronização
                </button>
            </div>
            <div class="col-12 col-md-auto">
                <button id="btn-consultar" type="button" class="btn btn-primary w-100">
                    Consultar registros
                </button>
            </div>
        </div>

        <!-- Mensagem de status -->
        <p id="mensagem" class="text-muted" role="status"></p>

        <!-- Registros -->
        <h2 class="h5 mb-3">Registros</h2>
        <div id="registros" class="row g-3">
            <div class="col-12">
                <p class="text-muted mb-0">
                    Nenhum registro carregado. Clique em “Consultar registros”.
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light-emphasis py-3 mt-4">
        <div class="container small text-center">
            OficinaSync – Atividade de Programação Front-End • Prof. Samuel
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
