<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão | Cadastro de Funcionários</title>
    <link rel="stylesheet" href="style.css">

    <!-- Importando o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="cabecalho py-4 mb-4">
        <div class="cotainer text-center">
            <h1>Cadastro de Funcionários</h1>
            <p>Sistema de Cadastro</p>
        </div>
    </header>

    <main class="container">
        <!-- Formulário -->
        <div class="card">
            <div class="card-header bg-dark text-white">
                Dados do funcionário
            </div>
            <div class="card-body">
                <form id="formFuncionario" onsubmit="enviarFormulario(event)">
                    <div class="row">
                        <!-- Nome -->
                         <div class="col-md-6 mb3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" id="nome" class="form-control">

                            <!-- Mensagem de erro -->
                             <div class="mensagem-erro" id="erroNome"></div>
                         </div>

                         <!-- CPF -->
                         <div class="col-md-6 mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" id="cpf" class="form-control">

                            <!-- Mensagem de erro -->
                             <div class="mensagem-erro" id="erroCpf"></div>
                         </div>

                         <!-- Telefone -->
                         <div class="col-md-6 mb3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" id="telefone" class="form-control">

                            <!-- Mensagem de erro -->
                             <div class="mensagem-erro" id="erroTelefone"></div>
                         </div>

                         <!-- Cargo -->
                          <div class="col-md-6 mb-3">
                            <label for="cargo" class="form-label">Cargo</label>

                            <select id="cargo" class="form-select">
                                <option value="">Selecione um cargo</option>
                                <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
                                <option value="Desenvolvedor TI">Desenvolvedor TI</option>
                                <option value="Gerente">Gerente</option>
                            </select>
                          </div>

                          <button class="btn btn-primary mb-2" type="submit">Enviar</button>
                          <button class="btn btn-danger">Limpar Formulário</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <!-- Importando o Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Importando o SweetAlert -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
