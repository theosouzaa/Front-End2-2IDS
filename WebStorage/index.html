<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ferramentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <!-- Começando um card -->
        <div class="card mt-5">
            <!-- Corpo card -->
            <div class="card-body">
                <h1 class="text-center">Cadastro de Ferramentas</h1>

                <!-- Iniciando uma linha -->
                <div class="row">
                    <!-- Nome ferramenta -->
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Ferramenta</label>
                        <input type="text" id="nome" placeholder="Ex: Chave de Fenda" class="form-control">
                    </div>

                    <!-- Setor da industria -->
                    <div class="col-md-4">
                        <label for="setor" class="form-label">Setor</label>
                        <select id="setor" class="form-select">
                            <option value="">Selecione</option>
                            <option value="Manutenção">Manutenção</option>
                            <option value="Produção">Produção</option>
                            <option value="Almoxarifado">Almoxarifado</option>
                            <option value="Qualidade">Qualidade</option>
                        </select>
                    </div>

                    <!-- Quantidade -->
                    <div class="col-md-4">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" id="quantidade" placeholder="Ex: 5" class="form-control">
                    </div>
                </div>

                <!-- Botão para envio -->
                <button type="button" onclick="cadastrarFerramenta()" class="btn btn-primary mt-4 w-100">Cadastrar
                    Ferramenta</button>
            </div>
        </div>
        <!-- Tabela dos dados -->
        <h2 class="mt-2">Ferramentas Cadastradas</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Ferramenta</th>
                    <th scope="col">Setor</th>
                    <th scope="col">Quantidade</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaFerramentas">
                <!-- Os registros serão colocados aqui com Js -->
            </tbody>
        </table>
        <button type="button" class="btn btn-danger" onclick="limparCadastros()">Limpar Cadastros</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
