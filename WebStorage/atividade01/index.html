<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Equipamentos de Proteção Individual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <!-- Começando um card -->
        <div class="card mt-5">
            <!-- Corpo card -->
            <div class="card-body">
                <h1 class="text-center">Cadastro de Equipamentos de Proteção Individual</h1>

                <!-- Iniciando uma linha -->
                <div class="row">
                    <!-- Nome ferramenta -->
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Equipamentos de Proteção Individual</label>
                        <input type="text" id="nome" placeholder="Ex: Capacete de segurança" class="form-control">
                    </div>

                    <!-- Setor da industria -->
                    <div class="col-md-4">
                        <label for="setor" class="form-label">Tipo de Proteção</label>
                        <select id="setor" class="form-select">
                            <option value="">Selecione</option>
                            <option value="Manutenção">Cabeça</option>
                            <option value="Produção">Olhos e face</option>
                            <option value="Almoxarifado">Audição</option>
                            <option value="Qualidade">Mãos e braços</option>
                            <option value="Qualidade">Pés e pernas</option>
                            <option value="Qualidade">Corpo</option>
                            <option value="Qualidade">Trabalho em altura</option>
                        </select>
                    </div>

                    <!-- Quantidade -->
                    <div class="col-md-4">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" id="quantidade" min="0" placeholder="Ex: 5" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label for="quantidade" class="form-label">Número do CA</label>
                        <input type="number" id="quantidade" min="0" placeholder="Ex: 5" class="form-control">
                    </div>
                </div>

                <!-- Botão para envio -->
                <button type="button" onclick="cadastrarEqipamento()" class="btn btn-primary mt-4 w-100">Cadastrar
                    Equipamentos</button>
            </div>
        </div>
        <!-- Tabela dos dados -->
        <h2 class="mt-2">Equipamentos Cadastradas</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Equipamentos</th>
                    <th scope="col">tipo de proteção</th>
                    <th scope="col">Quantidade</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaFerramentas">
                <!-- Os registros serão colocados aqui com Js -->
            </tbody>
        </table>
        <button type="button" class="btn btn-danger" onclick="limparCadastros()">Limpar Cadastros</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./scripit.js"></script>
</body>

</html>
